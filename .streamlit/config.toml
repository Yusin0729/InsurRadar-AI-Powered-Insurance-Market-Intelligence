[theme]
base = "light"
primaryColor = "#008A66"
backgroundColor = "#F5F8F6"
secondaryBackgroundColor = "#EAF2ED"
textColor = "#172B24"
font = "sans serif"
baseFontSize = 16
headingFontSizes = ["2rem", "1.5rem", "1.125rem"]
headingFontWeights = [700, 650, 600]
metricValueFontSize = "2rem"
baseRadius = "0.75rem"
buttonRadius = "0.5rem"
borderColor = "#D7E3DC"
dataframeHeaderBackgroundColor = "#EAF2ED"
dataframeHeaderTextColor = "#174C3C"
showWidgetBorder = true
paddingTop = "1.5rem"
chartCategoricalColors = ["#008A66", "#063E32", "#42CB83", "#7B9D8D"]

[theme.sidebar]
backgroundColor = "#063E32"
secondaryBackgroundColor = "#165744"
textColor = "#F2FAF5"
primaryColor = "#42CB83"
borderColor = "#528171"
headingFontSizes = ["1.75rem", "1.25rem", "1.125rem"]
paddingTop = "1rem"

[browser]
gatherUsageStats = false
